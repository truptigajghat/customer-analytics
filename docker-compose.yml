services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: churnq-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEBUG=false
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - churnq-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churnq-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - churnq-network

networks:
  churnq-network:
    driver: bridge
